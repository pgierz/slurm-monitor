---
- name: Provision Albedo monitoring VM (Prometheus + Alertmanager + Grafana)
  hosts: monitoring
  become: true
  gather_facts: true

  pre_tasks:
    - name: Assert supported Ubuntu release
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'Ubuntu'
          - ansible_distribution_version in ['22.04', '24.04']
        fail_msg: >-
          monitoring_stack only supports Ubuntu 22.04 / 24.04.
          Got {{ ansible_distribution }} {{ ansible_distribution_version }}.

  roles:
    - role: monitoring_stack
