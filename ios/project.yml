# XcodeGen project definition. The .xcodeproj is generated (`xcodegen` in this
# directory) and never committed. See README.md.
name: SlurmMonitor

options:
  bundleIdPrefix: de.awi
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en

# Project.xcconfig holds an empty DEVELOPMENT_TEAM, the identifier base
# APP_ID_BASE, and optionally includes the git-ignored Signing.xcconfig.
# Neither is set in `settings:` below, because project settings would
# override the xcconfig. Every identifier here is written with $(APP_ID_BASE),
# which Xcode resolves at build time, in build settings, in the Info.plist
# values and in the entitlements alike.
configFiles:
  Debug: Project.xcconfig
  Release: Project.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"

packages:
  SlurmKit:
    path: SlurmKit

targets:
  SlurmMonitor:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - "*.entitlements"
          - "**/*.md"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Slurm Monitor
        # The middle server sits inside the institute network and may be
        # served over plain http; the address is the user's own choice.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Read by SlurmKitConstants.appGroup; must match the entitlements.
        SlurmMonitorAppGroup: group.$(APP_ID_BASE)
        NSLocalNetworkUsageDescription: Slurm Monitor reads cluster status from your server on the local network.
        # Only the system's own TLS is used.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: $(APP_ID_BASE).oauth
            CFBundleTypeRole: Viewer
            # Fixed by the data contract (redirect URI of the sign-in), so
            # not derived from APP_ID_BASE.
            CFBundleURLSchemes:
              - de.awi.slurm-monitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID_BASE)
        PRODUCT_NAME: SlurmMonitor
        CODE_SIGN_ENTITLEMENTS: App/SlurmMonitor.entitlements
    dependencies:
      - package: SlurmKit
      - target: SlurmMonitorWidgets

  SlurmMonitorWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes:
          - Info.plist
          - "*.entitlements"
          - "**/*.md"
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Slurm Monitor
        # The middle server sits inside the institute network and may be
        # served over plain http; the address is the user's own choice.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Read by SlurmKitConstants.appGroup; must match the entitlements.
        SlurmMonitorAppGroup: group.$(APP_ID_BASE)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID_BASE).widgets
        CODE_SIGN_ENTITLEMENTS: Widgets/SlurmMonitorWidgets.entitlements
    dependencies:
      - package: SlurmKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

  ScreenshotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ScreenshotTests
      # The widget views are compiled into the test bundle as well, so they
      # can be rendered to PNG. The @main entry point must stay out.
      - path: Widgets
        excludes:
          - WidgetBundle.swift
          - Info.plist
          - "*.entitlements"
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID_BASE).screenshot-tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/SlurmMonitor.app/SlurmMonitor
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: SlurmMonitor
      - package: SlurmKit

schemes:
  SlurmMonitor:
    build:
      targets:
        SlurmMonitor: all
        SlurmMonitorWidgets: all
        ScreenshotTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ScreenshotTests
    archive:
      config: Release
