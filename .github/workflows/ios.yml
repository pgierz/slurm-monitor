name: iOS

on:
  push:
    paths:
      - "ios/**"
      - "docs/contract.md"
      - "server/tests/data/contract_samples/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "docs/contract.md"
      - "server/tests/data/contract_samples/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # Preferred Xcode on the macos-15 image; the select step falls back to the
  # newest installed Xcode 16.x if this exact version has been removed.
  XCODE_APP: /Applications/Xcode_16.4.app

jobs:
  slurmkit:
    name: SlurmKit (swift test)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check for the package
        id: pkg
        run: |
          if [ -f ios/SlurmKit/Package.swift ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ios/SlurmKit/Package.swift is absent; skipping swift build and test."
          fi

      - name: Select Xcode
        if: steps.pkg.outputs.present == 'true'
        run: |
          app="$XCODE_APP"
          if [ ! -d "$app" ]; then
            app="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)"
          fi
          if [ -n "$app" ] && [ -d "$app" ]; then
            sudo xcode-select -s "$app"
          else
            echo "::warning::No Xcode 16.x found; using the image default."
          fi
          xcodebuild -version
          swift --version

      - name: swift build
        if: steps.pkg.outputs.present == 'true'
        working-directory: ios/SlurmKit
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/logs"
          swift build --build-tests 2>&1 | tee "$RUNNER_TEMP/logs/swift-build.log" || {
            echo "===== error lines ====="
            grep -n "error:" "$RUNNER_TEMP/logs/swift-build.log" | sort -u | head -n 200
            exit 1
          }

      - name: swift test
        if: steps.pkg.outputs.present == 'true'
        working-directory: ios/SlurmKit
        run: |
          set -o pipefail
          swift test 2>&1 | tee "$RUNNER_TEMP/logs/swift-test.log" || {
            echo "===== error lines ====="
            grep -n -E "error:|failed" "$RUNNER_TEMP/logs/swift-test.log" | sort -u | head -n 200
            exit 1
          }

      - name: Publish condensed output to the ci-output branch
        if: always() && steps.pkg.outputs.present == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ios/scripts/publish-ci-output.sh slurmkit "$RUNNER_TEMP/logs"

      - name: Upload raw logs
        if: always() && steps.pkg.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: slurmkit-logs
          path: ${{ runner.temp }}/logs
          if-no-files-found: ignore

  app:
    name: App, widgets and screenshots
    runs-on: macos-15
    timeout-minutes: 40
    env:
      RESULT_BUNDLE: ${{ github.workspace }}/ios/build/ScreenshotTests.xcresult
      DERIVED_DATA: ${{ github.workspace }}/ios/build/DerivedData
      LOG_DIR: ${{ github.workspace }}/ios/build/logs
      SCREENSHOT_DIR: ${{ github.workspace }}/ios/screenshots
      DIRECT_DIR: ${{ github.workspace }}/ios/build/direct-screenshots
    steps:
      - uses: actions/checkout@v4

      - name: Check for the package
        id: pkg
        run: |
          if [ -f ios/SlurmKit/Package.swift ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ios/SlurmKit/Package.swift is absent; the app depends on it, so the app job is skipped."
          fi

      - name: Select Xcode
        if: steps.pkg.outputs.present == 'true'
        run: |
          app="$XCODE_APP"
          if [ ! -d "$app" ]; then
            app="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)"
          fi
          if [ -n "$app" ] && [ -d "$app" ]; then
            sudo xcode-select -s "$app"
          else
            echo "::warning::No Xcode 16.x found; using the image default."
          fi
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Install XcodeGen
        if: steps.pkg.outputs.present == 'true'
        run: |
          command -v xcodegen >/dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install xcodegen
          xcodegen --version

      - name: Generate the project
        if: steps.pkg.outputs.present == 'true'
        working-directory: ios
        run: |
          xcodegen generate
          xcodebuild -list -project SlurmMonitor.xcodeproj

      - name: Pick a simulator
        if: steps.pkg.outputs.present == 'true'
        working-directory: ios
        run: |
          xcrun simctl list runtimes
          udid="$(scripts/pick-simulator.sh iPhone)"
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"

      - name: Build for testing
        if: steps.pkg.outputs.present == 'true'
        working-directory: ios
        run: |
          build() {
            scripts/run-xcodebuild.sh "$LOG_DIR/$1" build-for-testing \
              -project SlurmMonitor.xcodeproj \
              -scheme SlurmMonitor \
              -configuration Debug \
              -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
              -derivedDataPath "$DERIVED_DATA" \
              -skipPackagePluginValidation \
              "${@:2}"
          }
          # Ad-hoc signing ("Sign to Run Locally") is what Xcode does for the
          # simulator by default and keeps the entitlements. If that does not
          # build on the runner, fall back to an unsigned build.
          if build build-adhoc.log CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=; then
            echo "SIGNING_MODE=adhoc" >> "$GITHUB_ENV"
          else
            echo "::warning::Ad-hoc signed build failed; retrying with CODE_SIGNING_ALLOWED=NO."
            build build-unsigned.log CODE_SIGNING_ALLOWED=NO
            echo "SIGNING_MODE=unsigned" >> "$GITHUB_ENV"
          fi

      - name: Run the screenshot tests
        if: steps.pkg.outputs.present == 'true'
        working-directory: ios
        env:
          # xcodebuild hands TEST_RUNNER_<NAME> to the test process as <NAME>.
          TEST_RUNNER_SNAPSHOT_OUTPUT_DIR: ${{ env.DIRECT_DIR }}
        run: |
          if [ "$SIGNING_MODE" = "unsigned" ]; then
            signing=(CODE_SIGNING_ALLOWED=NO)
          else
            signing=(CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=)
          fi
          rm -rf "$RESULT_BUNDLE"
          mkdir -p "$DIRECT_DIR"
          scripts/run-xcodebuild.sh "$LOG_DIR/test.log" test-without-building \
            -project SlurmMonitor.xcodeproj \
            -scheme SlurmMonitor \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RESULT_BUNDLE" \
            -parallel-testing-enabled NO \
            "${signing[@]}"

      - name: Extract the screenshots
        if: always() && steps.pkg.outputs.present == 'true'
        working-directory: ios
        run: scripts/extract-screenshots.sh "$RESULT_BUNDLE" "$SCREENSHOT_DIR" "$DIRECT_DIR"

      - name: Publish condensed output to the ci-output branch
        if: always() && steps.pkg.outputs.present == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ios/scripts/publish-ci-output.sh app ios/build/logs ios/screenshots

      - name: Upload the screenshots
        if: always() && steps.pkg.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: widget-screenshots
          path: ios/screenshots/*.png
          if-no-files-found: warn

      - name: Upload raw logs
        if: always() && steps.pkg.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: ios/build/logs
          if-no-files-found: ignore

      - name: Zip the result bundle
        if: failure() && steps.pkg.outputs.present == 'true'
        working-directory: ios/build
        run: |
          if [ -d ScreenshotTests.xcresult ]; then
            zip -qr ScreenshotTests.xcresult.zip ScreenshotTests.xcresult
          fi

      - name: Upload the result bundle
        if: failure() && steps.pkg.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: ios/build/ScreenshotTests.xcresult.zip
          if-no-files-found: ignore
