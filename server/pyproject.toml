[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slurm-monitor-server"
version = "1.0.0"
description = "Middle server between slurmrestd and the Slurm Monitor widgets"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.3",
    "pyjwt[crypto]>=2.8",
]

[project.scripts]
slurm-monitor-server = "slurm_monitor_server.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/slurm_monitor_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# server/tools is kept runnable on old system Pythons and is linted separately.
extend-exclude = ["tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
