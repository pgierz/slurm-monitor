[project]
authors = [{name = "Paul Gierz", email = "paul.gierz@awi.de"}]
name = "slurm-monitor"
description = "Prometheus exporter for Slurm via slurmrestd, with Grafana dashboards and alert rules. Built for AWI's Albedo cluster."
requires-python = ">= 3.11"
version = "0.5.0"
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["slurm", "hpc", "prometheus", "grafana", "monitoring"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Monitoring",
]

dependencies = [
  "httpx>=0.27,<1",
  "prometheus-client>=0.20,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "structlog>=24.1,<25",
  "click>=8.1.8,<9",
  "uvicorn>=0.30,<1",
  "starlette>=0.37,<1",
  "tenacity>=8.4,<9",
  "pyyaml>=6.0,<7",
]

[project.scripts]
slurm-monitor = "slurm_monitor.cli:cli"
slurm-monitor-exporter = "slurm_monitor.server.app:main"

[project.urls]
Homepage = "https://github.com/pgierz/slurm-monitor"
Documentation = "https://slurm-monitor.readthedocs.io"
Issues = "https://github.com/pgierz/slurm-monitor/issues"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/slurm_monitor"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.tasks]
slurm-monitor = "python -m slurm_monitor.cli"
exporter = "python -m slurm_monitor.server.app"
test = "pytest -q tests"
docs = "sphinx-build -b html docs docs/_build/html"
rtd = ".readthedocs/build.sh"
semrel = "semantic-release"

[tool.pixi.dependencies]
httpx = ">=0.27,<1"
prometheus_client = ">=0.20,<1"
pydantic = ">=2.7,<3"
pydantic-settings = ">=2.3,<3"
structlog = ">=24.1,<25"
click = ">=8.1.8,<9"
uvicorn = ">=0.30,<1"
starlette = ">=0.37,<1"
tenacity = ">=8.4,<9"
pyyaml = ">=6.0,<7"

[tool.pixi.environments.dev]
features = ["dev"]

[tool.pixi.environments.doc]
features = ["doc"]

[tool.pixi.feature.dev.dependencies]
pre-commit = "*"
ruff = "*"
pytest = "*"
pytest-asyncio = "*"
respx = "*"
mypy = "*"
toml = "*"
bumpversion = ">=0.5.3,<0.6"
commitizen = ">=4.6.0,<5"
python-semantic-release = ">=9.21.1,<10"

[tool.pixi.feature.doc.dependencies]
sphinx = "*"
pydata-sphinx-theme = ">=0.16.1,<0.17"
myst-parser = "*"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.semantic_release]
assets = []
build_command_env = []
commit_message = "Version {version}\n\nAutomatically generated by python-semantic-release"
commit_parser = "conventional"
logging_use_named_masks = false
major_on_zero = true
allow_zero_version = true
repo_dir = "."
no_git_verify = false
tag_format = "v{version}"
build_command = "python -m build -n -w"

[tool.semantic_release.branches.main]
match = "(main|master)"
prerelease_token = "rc"
prerelease = false

[tool.semantic_release.changelog]
changelog_file = ""
exclude_commit_patterns = []
mode = "init"
insertion_flag = "<!-- version list -->"
template_dir = "templates"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
output_format = "md"
mask_initial_release = false

[tool.semantic_release.commit_author]
env = "GIT_COMMIT_AUTHOR"
default = "semantic-release <semantic-release>"

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
other_allowed_tags = ["build", "chore", "ci", "docs", "style", "refactor", "test", "repo"]
allowed_tags = ["feat", "fix", "perf", "build", "chore", "ci", "docs", "style", "refactor", "test"]
default_bump_level = 0
parse_squash_commits = true
ignore_merge_commits = false

[tool.semantic_release.remote]
name = "origin"
type = "github"
ignore_token_for_push = false
insecure = false

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = true
